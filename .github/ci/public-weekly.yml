name: Weekly compatibility evidence

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    uses: ./.github/workflows/ci-scheduled.yml
    with:
      profile: weekly
      timeout-minutes: 60

  quality:
    uses: ./.github/workflows/ci-quality.yml
    with:
      timeout-minutes: 60
