name: Nightly compatibility evidence

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: compatibility-nightly
  cancel-in-progress: false

jobs:
  nightly:
    uses: ./.github/workflows/ci-scheduled.yml
    with:
      profile: nightly
      timeout-minutes: 60

  quality:
    uses: ./.github/workflows/ci-quality.yml
    with:
      timeout-minutes: 60

  incident:
    if: ${{ always() }}
    needs: [nightly, quality]
    uses: ./.github/workflows/compatibility-incident.yml
    with:
      profile: nightly
      required-result: ${{ needs.nightly.result }}
      quality-result: ${{ needs.quality.result }}
