name: Reusable runtime evidence

on:
  workflow_call:
    inputs:
      timeout-minutes:
        type: number
        default: 30

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: dev-main
  LC_ALL: C
  TZ: UTC

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      runtime: ${{ steps.matrix.outputs.runtime }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: matrix
        shell: bash
        run: echo "runtime=$(php tools/ci-matrix.php runtime-jobs)" >> "$GITHUB_OUTPUT"

  runtime:
    name: PHP ${{ matrix.php }} / ${{ matrix.runner }} / intl ${{ matrix.extensionMode }}${{ matrix.runNative && ' + native' || '' }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.runtime) }}
    uses: ./.github/workflows/ci-runtime-lane.yml
    with:
      runner: ${{ matrix.runner }}
      php: ${{ matrix.php }}
      extension-mode: ${{ matrix.extensionMode }}
      run-native: ${{ matrix.runNative }}
      test-package: ${{ matrix.testPackage }}
      setup-extension: ${{ matrix.extensionMode == 'absent' && ':intl, zip' || 'intl, zip' }}
      thread-safe: false
      integer-size: ${{ matrix.integerSize }}
      os-family: ${{ matrix.osFamily }}
      architecture: ${{ matrix.architecture }}
      expected-version: ${{ matrix.php }}
      artifact-name: runtime-${{ matrix.runner }}-php-${{ matrix.php }}-intl-${{ matrix.extensionMode }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
