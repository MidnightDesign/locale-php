name: Reusable runtime evidence

on:
  workflow_call:

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: dev-main
  LC_ALL: C
  TZ: UTC

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.matrix.outputs.runtime }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
        env:
          fail-fast: true
      - run: composer install --no-interaction --no-progress --prefer-dist
      - id: matrix
        shell: bash
        run: echo "runtime=$(php tools/ci-matrix.php runtime)" >> "$GITHUB_OUTPUT"

  runtime:
    name: PHP ${{ matrix.php }} / ${{ matrix.runner }} / intl ${{ matrix.extensionMode }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.runtime) }}
    env:
      INTL_LOCALE_BRANCH_TRACE: build/ci/branch-trace.json
      INTL_LOCALE_EXTENSION_MODE: ${{ matrix.extensionMode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensionMode == 'absent' && ':intl' || 'intl' }}
          ini-values: date.timezone=UTC, intl.default_locale=en_US_POSIX
          coverage: none
        env:
          fail-fast: true
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit --log-junit build/ci/junit.xml
      - if: always()
        run: php tools/record-ci-provenance.php build/ci/provenance.json "${{ matrix.php }}" "${{ matrix.runner }}" "${{ matrix.extensionMode }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.runner }}-php-${{ matrix.php }}-intl-${{ matrix.extensionMode }}
          path: build/ci
          if-no-files-found: error
          retention-days: 30
