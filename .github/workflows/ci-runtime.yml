name: Reusable runtime evidence

on:
  workflow_call:
    inputs:
      timeout-minutes:
        type: number
        default: 30

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: dev-main
  LC_ALL: C
  TZ: UTC

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      runtime: ${{ steps.matrix.outputs.runtime }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          tools: composer:2.10.3
          coverage: none
        env:
          fail-fast: true
          update: true
      - run: composer install --no-interaction --no-progress --prefer-dist
      - id: matrix
        shell: bash
        run: echo "runtime=$(php tools/ci-matrix.php runtime)" >> "$GITHUB_OUTPUT"

  runtime:
    name: PHP ${{ matrix.php }} / ${{ matrix.runner }} / intl ${{ matrix.extensionMode }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.runtime) }}
    uses: ./.github/workflows/ci-runtime-lane.yml
    with:
      runner: ${{ matrix.runner }}
      php: ${{ matrix.php }}
      extension-mode: ${{ matrix.extensionMode }}
      setup-extension: ${{ matrix.extensionMode == 'absent' && ':intl' || 'intl' }}
      thread-safe: false
      integer-size: ${{ matrix.integerSize }}
      os-family: ${{ matrix.osFamily }}
      architecture: ${{ matrix.architecture }}
      expected-version: ${{ matrix.php }}
      artifact-name: runtime-${{ matrix.runner }}-php-${{ matrix.php }}-intl-${{ matrix.extensionMode }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
