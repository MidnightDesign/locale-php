name: Reusable scheduled evidence

on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 60

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: dev-main
  LC_ALL: C
  TZ: UTC

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      advisory: ${{ steps.matrix.outputs.advisory }}
      arm: ${{ steps.matrix.outputs.arm }}
      icu: ${{ steps.matrix.outputs.icu }}
      windows-x86: ${{ steps.matrix.outputs.windows-x86 }}
      windows-ts: ${{ steps.matrix.outputs.windows-ts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: matrix
        shell: bash
        run: |
          echo "advisory=$(php tools/ci-matrix.php advisory-runtime)" >> "$GITHUB_OUTPUT"
          echo "arm=$(php tools/ci-matrix.php arm-runtime)" >> "$GITHUB_OUTPUT"
          echo "icu=$(php tools/ci-matrix.php icu-runtime)" >> "$GITHUB_OUTPUT"
          echo "windows-x86=$(php tools/ci-matrix.php windows-x86-runtime)" >> "$GITHUB_OUTPUT"
          echo "windows-ts=$(php tools/ci-matrix.php windows-ts-runtime)" >> "$GITHUB_OUTPUT"

  arm:
    if: ${{ inputs.profile == 'nightly' || inputs.profile == 'release' }}
    name: Arm / ${{ matrix.runner }} / PHP ${{ matrix.php }} / intl ${{ matrix.extensionMode }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.arm) }}
    uses: ./.github/workflows/ci-runtime-lane.yml
    with:
      runner: ${{ matrix.runner }}
      php: ${{ matrix.php }}
      extension-mode: ${{ matrix.extensionMode }}
      setup-extension: ${{ matrix.extensionMode == 'absent' && ':intl' || 'intl' }}
      thread-safe: false
      integer-size: 8
      os-family: Linux
      architecture: arm64
      expected-version: ${{ matrix.php }}
      artifact-name: arm-${{ matrix.runner }}-php-${{ matrix.php }}-intl-${{ matrix.extensionMode }}
      timeout-minutes: ${{ inputs.timeout-minutes }}

  windows-x86:
    if: ${{ inputs.profile == 'weekly' || inputs.profile == 'release' }}
    name: Windows x86 / PHP ${{ matrix.php }} / intl ${{ matrix.extensionMode }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.windows-x86) }}
    env:
      INTL_LOCALE_BRANCH_TRACE: build/ci/branch-trace.json
      INTL_LOCALE_EXTENSION_MODE: ${{ matrix.extensionMode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install checksum-pinned PHP x86 and Composer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'php-x86'
          $runtimeArchive = Join-Path $env:RUNNER_TEMP 'php-x86.zip'
          $composerPhar = Join-Path $runtimeRoot 'composer.phar'
          Invoke-WebRequest -Uri '${{ matrix.runtimeUrl }}' -OutFile $runtimeArchive
          if ((Get-FileHash -Algorithm SHA256 $runtimeArchive).Hash.ToLowerInvariant() -ne '${{ matrix.runtimeSha256 }}') {
              throw 'The PHP x86 archive checksum does not match the matrix pin.'
          }
          Expand-Archive -Path $runtimeArchive -DestinationPath $runtimeRoot
          Copy-Item (Join-Path $runtimeRoot 'php.ini-development') (Join-Path $runtimeRoot 'php.ini')
          Add-Content (Join-Path $runtimeRoot 'php.ini') @(
              'date.timezone=UTC',
              'intl.default_locale=en_US_POSIX',
              'extension_dir="ext"',
              'extension=curl',
              'extension=mbstring',
              'extension=openssl',
              'extension=zip'
          )
          if ('${{ matrix.extensionMode }}' -ne 'absent') {
              Add-Content (Join-Path $runtimeRoot 'php.ini') 'extension=intl'
          }
          Invoke-WebRequest -Uri 'https://getcomposer.org/download/2.10.3/composer.phar' -OutFile $composerPhar
          if ((Get-FileHash -Algorithm SHA256 $composerPhar).Hash.ToLowerInvariant() -ne '7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6') {
              throw 'The Composer PHAR checksum does not match the tool pin.'
          }
          Set-Content (Join-Path $runtimeRoot 'composer.bat') '@php "%~dp0composer.phar" %*'
          $runtimeRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: composer install --no-interaction --no-progress --prefer-dist
      - id: runtime_ready
        run: php tools/assert-ci-runtime.php 4 false Windows x86 "${{ matrix.runtimeVersion }}"
      - run: vendor/bin/phpunit --log-junit build/ci/junit.xml
      - name: Record ICU comparison
        if: ${{ !cancelled() && steps.runtime_ready.outcome == 'success' }}
        run: php tools/record-icu-comparison.php build/ci/icu-comparison.json
      - if: always()
        run: php tools/record-ci-provenance.php build/ci/provenance.json "${{ matrix.php }}" "${{ matrix.runner }}" "${{ matrix.extensionMode }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x86-php-${{ matrix.php }}-intl-${{ matrix.extensionMode }}
          path: build/ci
          if-no-files-found: error
          retention-days: 30

  windows-ts:
    if: ${{ inputs.profile == 'weekly' || inputs.profile == 'release' }}
    name: Windows TS / PHP ${{ matrix.php }} / intl ${{ matrix.extensionMode }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.windows-ts) }}
    uses: ./.github/workflows/ci-runtime-lane.yml
    with:
      runner: ${{ matrix.runner }}
      php: ${{ matrix.php }}
      extension-mode: ${{ matrix.extensionMode }}
      setup-extension: ${{ matrix.extensionMode == 'absent' && ':intl' || 'intl' }}
      thread-safe: true
      integer-size: 8
      os-family: Windows
      architecture: x64
      expected-version: ${{ matrix.php }}
      artifact-name: windows-ts-php-${{ matrix.php }}-intl-${{ matrix.extensionMode }}
      timeout-minutes: ${{ inputs.timeout-minutes }}

  icu:
    if: ${{ inputs.profile == 'weekly' || inputs.profile == 'release' }}
    name: ICU ${{ matrix.icu }} / PHP ${{ matrix.php }} / intl ${{ matrix.extensionMode }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.icu) }}
    uses: ./.github/workflows/ci-runtime-lane.yml
    with:
      runner: ${{ matrix.runner }}
      php: ${{ matrix.php }}
      extension-mode: ${{ matrix.extensionMode }}
      setup-extension: ${{ matrix.extension }}
      thread-safe: false
      integer-size: 8
      os-family: Linux
      architecture: x64
      expected-version: ${{ matrix.php }}
      expected-icu: ${{ matrix.icu }}
      artifact-name: icu-${{ matrix.boundary }}-php-${{ matrix.php }}-intl-${{ matrix.extensionMode }}
      timeout-minutes: ${{ inputs.timeout-minutes }}

  advisory-php:
    if: ${{ inputs.profile == 'nightly' || inputs.profile == 'release' }}
    name: Advisory PHP ${{ matrix.php }} / intl ${{ matrix.extensionMode }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.advisory) }}
    uses: ./.github/workflows/ci-runtime-lane.yml
    with:
      runner: ${{ matrix.runner }}
      php: ${{ matrix.php }}
      extension-mode: ${{ matrix.extensionMode }}
      setup-extension: ${{ matrix.extensionMode == 'absent' && ':intl' || 'intl' }}
      thread-safe: false
      integer-size: 8
      os-family: Linux
      architecture: x64
      expected-version: ${{ matrix.php }}
      artifact-name: advisory-php-${{ matrix.php }}-intl-${{ matrix.extensionMode }}
      advisory: true
      timeout-minutes: ${{ inputs.timeout-minutes }}
